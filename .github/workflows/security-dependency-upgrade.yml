name: One-time safe dependency remediation

permissions:
  contents: write

on:
  push:
    branches:
      - security-hardening-2026-09-04
    paths:
      - .github/workflows/security-dependency-upgrade.yml

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILLFI_ALLOW_BUILD_PLACEHOLDERS: "1"
      NEXT_PUBLIC_CHAIN_TARGET: arcTestnet
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-2026-09-04
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow build-safe security patches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.next = '15.5.25';
          pkg.devDependencies['eslint-config-next'] = '15.5.25';
          pkg.devDependencies.postcss = '8.5.28';
          pkg.overrides = {
            ...(pkg.overrides || {}),
            ws: '8.21.3',
            postcss: '8.5.28',
            axios: '1.20.0'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install
      - name: Production dependency audit
        run: |
          status=1
          for attempt in 1 2 3; do
            set +e
            timeout 180s npm audit --omit=dev --audit-level=high
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            echo "npm audit attempt ${attempt} failed with exit ${status}; retrying if attempts remain"
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit "$status"
      - name: Type check
        run: npm run typecheck
      - name: Product tests
        run: npm run test:product
      - name: Production build
        run: npm run build
      - name: Commit validated dependency remediation
        run: |
          git config user.name "skillfi-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate production dependency advisories"
          git pull --rebase origin security-hardening-2026-09-04
          git push origin HEAD:security-hardening-2026-09-04
