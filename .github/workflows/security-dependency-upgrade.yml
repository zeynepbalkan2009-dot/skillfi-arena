name: One-time safe dependency remediation

permissions:
  contents: write

on:
  push:
    branches:
      - security-hardening-2026-09-04
    paths:
      - .github/workflows/security-dependency-upgrade.yml

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILLFI_ALLOW_BUILD_PLACEHOLDERS: "1"
      NEXT_PUBLIC_CHAIN_TARGET: arcTestnet
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-2026-09-04
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify peer contracts
        run: |
          npm view @privy-io/wagmi@4.0.17 peerDependencies --json
          npm view @privy-io/react-auth@3.32.2 peerDependencies --json
          npm view wagmi@2.19.5 peerDependencies --json
      - name: Regenerate lockfile from validated compatibility lines
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.next = '15.5.25';
          pkg.dependencies['@privy-io/wagmi'] = '4.0.17';
          pkg.dependencies.viem = '2.56.0';
          pkg.devDependencies['eslint-config-next'] = '15.5.25';
          pkg.devDependencies.postcss = '8.5.28';
          pkg.overrides = { ...(pkg.overrides || {}), ws: '8.21.3', postcss: '8.5.28', axios: '1.20.0' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm package-lock.json
          npm install
          npm audit fix
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Product tests
        run: npm run test:product
      - name: Production build
        run: npm run build
      - name: Commit validated dependency remediation
        run: |
          git config user.name "skillfi-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate production dependency advisories"
          git push origin HEAD:security-hardening-2026-09-04
