name: One-time safe dependency remediation

permissions:
  contents: write

on:
  push:
    branches:
      - security-hardening-2026-09-04
    paths:
      - .github/workflows/security-dependency-upgrade.yml

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILLFI_ALLOW_BUILD_PLACEHOLDERS: "1"
      NEXT_PUBLIC_CHAIN_TARGET: arcTestnet
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-2026-09-04
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade within existing compatibility lines
        run: |
          npm view ws@8.21.3 version
          npm view postcss@8.5.28 version
          npm view axios@1.20.0 version
          npm install --save-exact next@15.5.25 @privy-io/react-auth@3.40.0 @privy-io/wagmi@4.0.17 viem@2.56.0
          npm install --save-dev --save-exact eslint-config-next@15.5.25 postcss@8.5.28
          npm pkg set 'overrides.ws=8.21.3' 'overrides.postcss=8.5.28' 'overrides.axios=1.20.0'
          npm install
          npm audit fix
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Product tests
        run: npm run test:product
      - name: Production build
        run: npm run build
      - name: Commit validated dependency remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "skillfi-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate production dependency advisories"
          git push origin HEAD:security-hardening-2026-09-04
