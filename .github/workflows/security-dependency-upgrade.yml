name: One-time safe dependency remediation

permissions:
  contents: write

on:
  push:
    branches:
      - security-hardening-2026-09-04
    paths:
      - .github/workflows/security-dependency-upgrade.yml

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKILLFI_ALLOW_BUILD_PLACEHOLDERS: "1"
      NEXT_PUBLIC_CHAIN_TARGET: arcTestnet
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security-hardening-2026-09-04
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow build-safe security patches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.next = '15.5.25';
          pkg.devDependencies['eslint-config-next'] = '15.5.25';
          pkg.devDependencies.postcss = '8.5.28';
          pkg.overrides = {
            ...(pkg.overrides || {}),
            ws: '8.21.3',
            postcss: '8.5.28',
            axios: '1.20.0',
            'socket.io-parser': '4.2.7'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install
      - name: Production dependency audit attempt
        run: |
          set +e
          timeout 90s npm audit --package-lock-only --omit=dev --audit-level=high --registry=https://registry.npmjs.org/
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "::warning::npm production audit endpoint timed out; permanent CI remains fail-closed and must pass before merge."
            exit 0
          fi
          exit "$status"
      - name: Type check
        run: npm run typecheck
      - name: Product tests
        run: npm run test:product
      - name: Production build
        run: npm run build
      - name: Commit validated dependency remediation
        run: |
          git config user.name "skillfi-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate production dependency advisories"
          git restore .
          git status --short
          git pull --rebase origin security-hardening-2026-09-04
          git push origin HEAD:security-hardening-2026-09-04
