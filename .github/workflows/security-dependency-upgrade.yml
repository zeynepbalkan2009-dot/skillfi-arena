name: One-time dependency security reconnaissance

permissions:
  contents: read

on:
  push:
    branches:
      - security-hardening-2026-09-04
    paths:
      - .github/workflows/security-dependency-upgrade.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check direct wallet package usage
        shell: bash
        run: |
          echo "=== source imports ==="
          grep -R -nE "from ['\"](wagmi|@privy-io/wagmi)['\"]|require\(['\"](wagmi|@privy-io/wagmi)['\"]\)" app components lib tests scripts 2>/dev/null || true
          echo "=== latest compatible package lines ==="
          npm view @privy-io/node version
          npm view @privy-io/react-auth version
          npm view @privy-io/wagmi version
          npm view viem version
          npm view wagmi version
          npm view wagmi@2 version --json
          npm view next@15 version --json
