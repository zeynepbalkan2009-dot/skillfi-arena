name: One-time dependency security audit

permissions:
  contents: read

on:
  push:
    branches:
      - security-hardening-2026-09-04
    paths:
      - .github/workflows/security-dependency-upgrade.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies from lockfile
        run: npm audit --omit=dev --audit-level=high
