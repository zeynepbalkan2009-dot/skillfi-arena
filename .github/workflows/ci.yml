name: SkillFi Arena CI

permissions:
  contents: read

concurrency:
  group: skillfi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop
      - security-hardening-2026-09-04

  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Next.js Build
    runs-on: ubuntu-latest
    env:
      SKILLFI_ALLOW_BUILD_PLACEHOLDERS: "1"
      NEXT_PUBLIC_CHAIN_TARGET: "arcTestnet"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: |
          status=1
          for attempt in 1 2; do
            set +e
            timeout 240s npm audit --package-lock-only --omit=dev --audit-level=high --registry=https://registry.npmjs.org/
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then break; fi
            echo "npm audit attempt ${attempt} failed with exit ${status}"
            if [ "$attempt" -lt 2 ]; then sleep 15; fi
          done
          exit "$status"

      - name: Type Check
        run: npm run typecheck

      - name: Product Tests
        run: npm run test:product

      - name: Build
        run: npm run build

  smart-contracts:
    name: Hardhat Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web3/package-lock.json

      - name: Install
        run: npm ci

      - name: Production dependency audit
        run: |
          status=1
          for attempt in 1 2; do
            set +e
            timeout 240s npm audit --package-lock-only --omit=dev --audit-level=high --registry=https://registry.npmjs.org/
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then break; fi
            echo "npm audit attempt ${attempt} failed with exit ${status}"
            if [ "$attempt" -lt 2 ]; then sleep 15; fi
          done
          exit "$status"

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Run Tests
        run: npx hardhat test
