name: SkillFi Arena CI

permissions:
  contents: read

concurrency:
  group: skillfi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Product Tests
        run: npm run test:product

      - name: Build
        run: npm run build

  smart-contracts:
    name: Hardhat Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Run Tests
        run: npx hardhat test
